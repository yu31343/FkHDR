name: Build and Release FkHDR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          SDK_LIST=$(sdkmanager --list 2>/dev/null || true)
          PLAT_PKG=$(printf '%s\n' "$SDK_LIST" | grep -oE 'platforms;android-37(\.[0-9]+)?' | head -n1 || true)
          BT_PKG=$(printf '%s\n' "$SDK_LIST" | grep -oE 'build-tools;37\.[0-9]+\.[0-9]+' | tail -n1 || true)
          echo "Installing ${PLAT_PKG:-platforms;android-37} and ${BT_PKG:-build-tools;37.0.0}"
          sdkmanager "${PLAT_PKG:-platforms;android-37}" "${BT_PKG:-build-tools;37.0.0}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p hdr-module/keystore
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > hdr-module/keystore/fkoscreen-debug.jks
          fi

      - name: Build Release APK
        working-directory: hdr-module
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Prepare Release APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            VERSION="${GITHUB_SHA::7}"
          fi
          cp hdr-module/app/build/outputs/apk/release/app-release.apk "FkHDR-${VERSION}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FkHDR-apk
          path: FkHDR-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FkHDR-*.apk
          generate_release_notes: true
